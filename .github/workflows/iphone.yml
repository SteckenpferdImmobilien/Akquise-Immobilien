name: iPhone-App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Objekt- und Kalenderprüfungen
        run: |
          npm ci --ignore-scripts
          npm test
      - name: iPhone-Version als Startseite vorbereiten
        run: |
          mkdir -p /tmp/akquise-site
          cp -R public/. /tmp/akquise-site/
          cp public/phone.html /tmp/akquise-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/akquise-site
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
